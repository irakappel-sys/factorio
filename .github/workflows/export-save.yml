name: Export Factorio save

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify save exists
        run: |
          set -euo pipefail
          test -f _save1.zip
          unzip -t _save1.zip

      - name: Upload Factorio save
        uses: actions/upload-artifact@v4
        with:
          name: factorio-save
          path: _save1.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
