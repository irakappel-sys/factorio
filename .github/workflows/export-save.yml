name: Export and analyze Factorio save

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify save archive
        run: |
          set -euo pipefail
          test -f _save1.zip
          unzip -t _save1.zip

      - name: Upload raw Factorio save
        uses: actions/upload-artifact@v4
        with:
          name: factorio-save
          path: _save1.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Download Factorio headless
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://factorio.com/get-download/stable/headless/linux64 \
            --output factorio.tar.xz
          tar -xJf factorio.tar.xz
          ./factorio/bin/x64/factorio --version

      - name: Install analyzer mod
        run: |
          set -euo pipefail
          mkdir -p factorio/mods
          rm -rf factorio/mods/factory_analyzer_1.0.0
          sed 's/game\.write_file/helpers.write_file/g' factory_analyzer/control.lua > /tmp/control.lua
          cp -a factory_analyzer factorio/mods/factory_analyzer_1.0.0
          cp /tmp/control.lua factorio/mods/factory_analyzer_1.0.0/control.lua
          cat > factorio/mods/mod-list.json <<'JSON'
          {
            "mods": [
              {"name": "base", "enabled": true},
              {"name": "elevated-rails", "enabled": false},
              {"name": "quality", "enabled": false},
              {"name": "space-age", "enabled": false},
              {"name": "factory_analyzer", "enabled": true}
            ]
          }
          JSON

      - name: Load save and collect factory data
        run: |
          set -euo pipefail
          rm -rf factorio/script-output
          mkdir -p factorio/script-output
          ./factorio/bin/x64/factorio \
            --benchmark "$GITHUB_WORKSPACE/_save1.zip" \
            --benchmark-ticks 3 \
            --benchmark-runs 1
          echo '--- script-output ---'
          find factorio/script-output -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -f factorio/script-output/factory-analysis.json
          test -f factorio/script-output/factory-summary.txt

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-analysis
          path: |
            factorio/script-output/factory-analysis.json
            factorio/script-output/factory-summary.txt
            factorio/script-output/factory-analysis-error.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
